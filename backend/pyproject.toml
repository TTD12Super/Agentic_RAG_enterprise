[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agentic-rag-backend"
version = "0.1.0"
description = "Backend runtime baseline for Enterprise Agentic RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langgraph>=1.2,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]
db = [
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
