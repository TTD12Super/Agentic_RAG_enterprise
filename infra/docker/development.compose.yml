services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enterprise_rag_dev
      POSTGRES_USER: enterprise_rag_dev
      POSTGRES_PASSWORD: synthetic_only_not_secret
    ports:
      - "127.0.0.1:55433:5432"
    networks:
      - development
    tmpfs:
      - /var/lib/postgresql/data
    shm_size: 128m
    restart: "no"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U enterprise_rag_dev -d enterprise_rag_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

networks:
  development:
